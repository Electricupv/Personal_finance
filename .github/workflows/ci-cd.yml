name: CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Print build result
        run: echo "Сборка и тесты завершены. Артефакт target/Personal_finance-1.0-SNAPSHOT.jar готов."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance
          path: target/Personal_finance-1.0-SNAPSHOT.jar
          if-no-files-found: error
